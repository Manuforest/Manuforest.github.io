name: Build and publish journal
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: journal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: blog/requirements.txt
      - run: python -m pip install -r blog/requirements.txt
      - name: Test content handling
        run: python -m unittest discover -s blog -p 'test_*.py' -v
      - name: Build static pages
        run: python blog/build.py
      - name: Verify preserved articles and output boundaries
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for file in Path('api/articles').glob('*.json'):
              post = json.loads(file.read_text())
              if not post.get('hidden'):
                  assert Path('_site/post', post['slug'] + '.html').is_file(), file
                  assert Path('_site/post', post['slug'], 'index.html').is_file(), file
          assert not Path('_site/api/site.json').exists()
          assert not Path('_site/content').exists()
          print('Legacy routes and publication boundaries verified.')
          PY
      - name: Upload reviewable site
        uses: actions/upload-artifact@v4
        with:
          name: journal-preview
          path: _site/
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site/
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
